name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Sohba.slnx

      - name: Build (Release)
        run: dotnet build Sohba.slnx --no-restore --configuration Release

      - name: Run tests (Domain + Application)
        run: dotnet test Sohba.slnx --no-build --configuration Release